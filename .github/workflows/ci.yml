name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Baixa o código
        uses: actions/checkout@v5

      - name: Configura o Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala as dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Roda os testes de unidade com cobertura
        run: pytest tests/unit -v --cov=app --cov-report=term-missing --cov-fail-under=80
