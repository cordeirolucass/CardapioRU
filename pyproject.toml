[project]
name = "cardapioru"
version = "0.1.0"
description = "Cardápio interativo e avaliação de pratos do restaurante universitário"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
